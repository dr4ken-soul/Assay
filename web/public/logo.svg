<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Assay">
  <title>Assay</title>
  <!--
    Three anonymised columns, one crowned. The product in one mark: the trial
    runs every model as an equal column, and exactly one of them is chosen.
    Ink on the clinical bench, one red indicator. Square, because the platform
    centre-crops a logo to a square anyway.
  -->
  <rect width="512" height="512" fill="#f7f9f5"/>
  <g>
    <!-- column A, ink -->
    <rect x="128" y="176" width="56" height="176" rx="10" fill="#141814"/>
    <!-- column B, the crown, red indicator -->
    <rect x="228" y="128" width="56" height="224" rx="10" fill="#d3301f"/>
    <!-- column C, ink -->
    <rect x="328" y="176" width="56" height="176" rx="10" fill="#141814"/>
    <!-- the blind tie, one hairline under the three -->
    <rect x="128" y="380" width="256" height="6" rx="3" fill="#141814" fill-opacity="0.18"/>
  </g>
</svg>
